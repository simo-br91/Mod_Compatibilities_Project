name: Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    name: Staging Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: modcompat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d modcompat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/modcompat
      APP_ENV: staging
      LOG_LEVEL: info
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/recommendation/go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staging smoke
        run: pnpm smoke:staging

      - name: Upload staging smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-logs
          path: .staging-smoke-logs
          if-no-files-found: ignore
