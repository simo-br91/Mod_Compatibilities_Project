x-staging-env: &staging-env
  APP_ENV: staging
  LOG_LEVEL: info
  POSTGRES_URL: postgres://postgres:postgres@postgres:5432/modcompat
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: neo4jpassword
  OPENSEARCH_URL: http://opensearch:9200
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio123
  S3_BUCKET_RAW: modcompat-raw
  S3_BUCKET_ARTIFACTS: modcompat-artifacts
  EVIDENCE_SERVICE_URL: http://evidence:8081
  ADMIN_SERVICE_URL: http://admin:8082
  RECOMMENDATION_SERVICE_URL: http://recommendation:8083
  GRAPH_SERVICE_URL: http://graph:8084
  SIMULATION_SERVICE_URL: http://simulation:8085
  ORCHESTRATOR_SERVICE_URL: http://analysis-orchestrator:8086
  ARTIFACT_ANALYSIS_SERVICE_URL: http://artifact-analysis:9090
  WORKSPACE_SERVICE_URL: http://workspace:8090
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}

services:
  artifact-analysis:
    build:
      context: .
      dockerfile: docker/artifact-analysis.Dockerfile
    image: modcompat/artifact-analysis:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      ARTIFACT_ANALYSIS_HTTP_PORT: 9090
    depends_on:
      - postgres
    ports:
      - "9090:9090"

  evidence:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: apps/evidence
    image: modcompat/evidence:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      EVIDENCE_HTTP_PORT: 8081
    depends_on:
      - postgres
    ports:
      - "8081:8081"

  admin:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: apps/admin
    image: modcompat/admin:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      ADMIN_HTTP_PORT: 8082
    depends_on:
      - postgres
      - evidence
    ports:
      - "8082:8082"

  analysis-orchestrator:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: apps/analysis-orchestrator
    image: modcompat/analysis-orchestrator:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      ORCHESTRATOR_HTTP_PORT: 8086
    depends_on:
      - postgres
      - artifact-analysis
    ports:
      - "8086:8086"

  recommendation:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args:
        SERVICE_DIR: recommendation
    image: modcompat/recommendation:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      RECOMMENDATION_HTTP_PORT: 8083
      ORCHESTRATOR_SERVICE_URL: http://analysis-orchestrator:8086
    depends_on:
      - analysis-orchestrator
    ports:
      - "8083:8083"

  graph:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args:
        SERVICE_DIR: graph
    image: modcompat/graph:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      GRAPH_HTTP_PORT: 8084
      ORCHESTRATOR_SERVICE_URL: http://analysis-orchestrator:8086
    depends_on:
      - analysis-orchestrator
    ports:
      - "8084:8084"

  simulation:
    build:
      context: .
      dockerfile: docker/go-service.Dockerfile
      args:
        SERVICE_DIR: simulation
    image: modcompat/simulation:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      SIMULATION_HTTP_PORT: 8085
      ORCHESTRATOR_SERVICE_URL: http://analysis-orchestrator:8086
    depends_on:
      - analysis-orchestrator
    ports:
      - "8085:8085"

  workspace:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: apps/workspace
        SERVICE_ENTRY: src/server.ts
    image: modcompat/workspace:${MODCOMPAT_IMAGE_TAG:-dev}
    environment:
      <<: *staging-env
      WORKSPACE_HTTP_PORT: 8090
    ports:
      - "8090:8090"
