              type: array
              items:
                type: object
                required: [name, resolution_method, confidence]
                properties:
                  name: { type: string }
                  version: { type: string }
                  source: { type: string }
                  canonical_project_id: { type: string }
                  canonical_version_id: { type: string }
                  resolution_method:
                    type: string
                    enum: [source_mapping, slug_match, alias_match, unresolved]
                  confidence: { type: number, minimum: 0, maximum: 1 }
