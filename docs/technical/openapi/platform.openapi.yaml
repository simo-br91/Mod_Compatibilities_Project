    AnalysisEnvironment:
      type: object
      required: [minecraft_version, loader, java_version, side]
      properties:
        minecraft_version: { type: string }
        loader: { type: string, enum: [forge, fabric, quilt, neoforge, unknown] }
        java_version: { type: string }
        side: { type: string, enum: [client, server, both] }
    AnalysisSummary:
      type: object
      required: [analysis_id, project_id, workspace_id, status, trigger, analysis_mode, created_at]
      properties:
        analysis_id: { type: string }
        project_id: { type: string }
        workspace_id: { type: string }
        organization_id: { type: string }
        pack_snapshot_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        trigger: { type: string, enum: [manual, webhook, scheduled, api] }
        analysis_mode: { type: string, enum: [fast, standard, deep] }
        score: { type: number, format: float }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            info: { type: integer }
    AnalysisProgressResponse:
      type: object
      required: [analysis, phases, events]
      properties:
        analysis: { $ref: '#/components/schemas/AnalysisSummary' }
        phases:
          type: array
          items:
            type: object
            required: [phase_id, analysis_id, phase_name, status, duration_ms, started_at, finished_at]
            properties:
              phase_id: { type: string }
              analysis_id: { type: string }
              phase_name:
                type: string
                enum: [normalization, resolution, static_analysis, graph_enrichment, merge_findings, pack_diff, rule_evaluation, recommendation, reporting]
              status: { type: string, enum: [completed, skipped, failed] }
              duration_ms: { type: integer }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            required: [event_id, analysis_id, event_type, message, occurred_at]
            properties:
              event_id: { type: string }
              analysis_id: { type: string }
              event_type:
                type: string
                enum:
                  - analysis.queued
                  - analysis.started
                  - analysis.phase.completed
                  - analysis.finding.emitted
                  - analysis.completed
                  - analysis.failed
              message: { type: string }
              occurred_at: { type: string, format: date-time }
              phase_name:
                type: string
                enum: [normalization, resolution, static_analysis, graph_enrichment, merge_findings, pack_diff, rule_evaluation, recommendation, reporting]
    FindingsResponse:
      type: object
      required: [items]
