        input_ref:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [pack_snapshot, import, manifest, uploaded_mods] }
            id: { type: string }
        environment: { $ref: '#/components/schemas/AnalysisEnvironment' }
        options:
          type: object
          properties:
            run_simulation: { type: boolean }
            include_alternatives: { type: boolean }
            include_low_confidence: { type: boolean }
            compare_to_snapshot_id: { type: string }
            baseline_analysis_id: { type: string }
    CreateAnalysisResponse:
      type: object
