apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-analysis
  namespace: modcompat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-analysis
  template:
    metadata:
      labels:
        app: artifact-analysis
    spec:
      serviceAccountName: modcompat-runtime
      containers:
        - name: artifact-analysis
          image: modcompat/artifact-analysis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: http
          envFrom:
            - configMapRef:
                name: modcompat-runtime-config
            - secretRef:
                name: modcompat-runtime-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-analysis
  namespace: modcompat
spec:
  selector:
    app: artifact-analysis
  ports:
    - port: 9090
      targetPort: http
      name: http
---
